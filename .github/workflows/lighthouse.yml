name: Lighthouse

on:
  workflow_dispatch:
  schedule:
    # Weekly audit of production (after Netlify deploys have landed).
    - cron: "0 14 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Lighthouse CI — homepage
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://www.liarliarpantsontyler.com/
          uploadArtifacts: true
          temporaryPublicStorage: true

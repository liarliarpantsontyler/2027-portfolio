# Production branch is configured in Netlify UI (Site settings → Build & deploy → Branches).
# Use `main` after running scripts/sync-main-to-github.sh.

[build]
  command = "npm run build"
  publish = "out"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/home/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
